<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Coral+Pixels&family=Fredericka+the+Great&family=Lobster&display=swap"

    <link
        href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
        rel="stylesheet">
    <style>
        body,
        html {
            height: 100%;
            margin: 0;
            padding: 0;
            background: url('https://static.vecteezy.com/system/resources/thumbnails/015/567/763/small/abstract-yellow-background-with-wavy-line-vector.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        .berkshire-swash-regular {
            font-family: "Berkshire Swash", serif;
            font-weight: 400;
            font-style: normal;
        }

        .subtext {
            font-family: "Lobster", sans-serif;
            font-weight: 400;
            font-style: normal;
            color: rgb(6, 47, 82);
            font-size: 20px;
        }

        .logo {
            width: 300px;
            height: auto;
            margin-bottom: 20px;
        }

        .center-box {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content-box {
            width: 90%;
            max-width: 1000px;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .left-section,
        .right-section {
            padding: 30px;
        }

        .left-section {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .right-section img {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
        }



        @media (max-width: 768px) {
            .row {
                flex-direction: column;
            }

            .left-section,
            .right-section {
                padding: 20px;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="center-box">
        <div class="content-box container">
            <div class="row g-0">
                <div class="col-md-6 left-section">
                    <div>
                        <img src="https://vigilanceservices.co.in/wp-content/uploads/2022/01/cropped-Footer-Logo-1-scaled-1.png"
                            alt="Tech Image" class="logo" />
                        <h5 class="berkshire-swash-regular">Welcome to VIGILANCE SERVICES </h5>
                        <!-- <p class="subtext">You are not authorized to view this page ..</p> -->
                        <br>
                        <!-- <p><a href="https://vigilanceservices.co.in/">Please continue here ...</a></p>  -->
                        <p>
                            <a href="https://vigilanceservices.co.in/" style="
    display: inline-block;
    background-color: #275E76;
    color: white;
    margin-top: 10px;
    padding: 10px 20px;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
  ">
                                Continue Here
                            </a>
                        </p>


                    </div>
                </div>
                <div class="col-md-6 right-section">
                    <img src="./images/maintanace.jpg" alt="Tech Image" />
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
